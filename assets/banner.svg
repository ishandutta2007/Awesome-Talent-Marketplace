<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1">
        <animate attributeName="stop-color" values="#0f0c29;#1a1a4e;#0f0c29" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1">
        <animate attributeName="stop-color" values="#302b63;#4a3f8a;#302b63" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1">
        <animate attributeName="stop-color" values="#24243e;#3d3566;#24243e" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#3a7bd5"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f857a6"/>
      <stop offset="100%" style="stop-color:#ff5858"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e"/>
      <stop offset="100%" style="stop-color:#38ef7d"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="12"/>

  <!-- Animated grid lines -->
  <g opacity="0.06" stroke="#a855f7" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50"><animate attributeName="y1" values="50;60;50" dur="8s" repeatCount="indefinite"/></line>
    <line x1="0" y1="100" x2="1200" y2="100"><animate attributeName="y1" values="100;110;100" dur="7s" repeatCount="indefinite"/></line>
    <line x1="0" y1="150" x2="1200" y2="150"><animate attributeName="y1" values="150;140;150" dur="9s" repeatCount="indefinite"/></line>
    <line x1="0" y1="200" x2="1200" y2="200"><animate attributeName="y1" values="200;210;200" dur="6s" repeatCount="indefinite"/></line>
    <line x1="0" y1="250" x2="1200" y2="250"><animate attributeName="y1" values="250;240;250" dur="8s" repeatCount="indefinite"/></line>
    <line x1="200" y1="0" x2="200" y2="300"><animate attributeName="x1" values="200;210;200" dur="7s" repeatCount="indefinite"/></line>
    <line x1="400" y1="0" x2="400" y2="300"><animate attributeName="x1" values="400;390;400" dur="9s" repeatCount="indefinite"/></line>
    <line x1="600" y1="0" x2="600" y2="300"><animate attributeName="x1" values="600;610;600" dur="6s" repeatCount="indefinite"/></line>
    <line x1="800" y1="0" x2="800" y2="300"><animate attributeName="x1" values="800;790;800" dur="8s" repeatCount="indefinite"/></line>
    <line x1="1000" y1="0" x2="1000" y2="300"><animate attributeName="x1" values="1000;1010;1000" dur="7s" repeatCount="indefinite"/></line>
  </g>

  <!-- Connection lines (network effect) -->
  <g stroke="url(#nodeGrad1)" stroke-width="1.5" opacity="0.3" filter="url(#glow)">
    <line x1="120" y1="150" x2="320" y2="100">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="320" y1="100" x2="520" y2="170">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="520" y1="170" x2="720" y2="120">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4.5s" repeatCount="indefinite"/>
    </line>
    <line x1="720" y1="120" x2="920" y2="180">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="920" y1="180" x2="1080" y2="140">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="320" y1="100" x2="520" y2="170">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="120" y1="150" x2="520" y2="170">
      <animate attributeName="opacity" values="0.05;0.25;0.05" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="720" y1="120" x2="1080" y2="140">
      <animate attributeName="opacity" values="0.05;0.25;0.05" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Pulsing network nodes -->
  <!-- Node 1 -->
  <circle cx="120" cy="150" r="8" fill="url(#nodeGrad1)" filter="url(#glow)">
    <animate attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="150" r="20" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="12;28;12" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 2 -->
  <circle cx="320" cy="100" r="10" fill="url(#nodeGrad2)" filter="url(#glow)">
    <animate attributeName="r" values="8;12;8" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="100" r="24" fill="none" stroke="#f857a6" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="14;32;14" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 3 -->
  <circle cx="520" cy="170" r="7" fill="url(#nodeGrad3)" filter="url(#glow)">
    <animate attributeName="r" values="5;9;5" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="170" r="18" fill="none" stroke="#38ef7d" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="10;26;10" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 4 -->
  <circle cx="720" cy="120" r="9" fill="url(#nodeGrad1)" filter="url(#glow)">
    <animate attributeName="r" values="7;11;7" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="120" r="22" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="13;30;13" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 5 -->
  <circle cx="920" cy="180" r="8" fill="url(#nodeGrad2)" filter="url(#glow)">
    <animate attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="920" cy="180" r="20" fill="none" stroke="#f857a6" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="12;28;12" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 6 -->
  <circle cx="1080" cy="140" r="7" fill="url(#nodeGrad3)" filter="url(#glow)">
    <animate attributeName="r" values="5;9;5" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="140" r="18" fill="none" stroke="#38ef7d" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="10;26;10" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating particles -->
  <circle cx="50" cy="40" r="2" fill="#a855f7" opacity="0.4">
    <animate attributeName="cy" values="40;30;40" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="260" r="1.5" fill="#00d2ff" opacity="0.3">
    <animate attributeName="cy" values="260;245;260" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="30" r="2" fill="#f472b6" opacity="0.3">
    <animate attributeName="cy" values="30;20;30" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="270" r="1.5" fill="#38ef7d" opacity="0.3">
    <animate attributeName="cy" values="270;255;270" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="35" r="2" fill="#a855f7" opacity="0.4">
    <animate attributeName="cy" values="35;22;35" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.55;0.2" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1150" cy="250" r="1.5" fill="#00d2ff" opacity="0.3">
    <animate attributeName="cy" values="250;238;250" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="6.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Title text -->
  <text x="600" y="110" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="800" fill="url(#textGrad)" filter="url(#softGlow)">
    Awesome Talent Marketplace
    <animate attributeName="opacity" values="0.9;1;0.9" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="600" y="155" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c4b5fd" opacity="0.85">
    SaaS Platforms  •  Open-Source Projects  •  Skills Matching  •  Internal Mobility
  </text>

  <!-- Accent line -->
  <rect x="420" y="172" width="360" height="2" rx="1" fill="url(#textGrad)" opacity="0.5">
    <animate attributeName="width" values="300;400;300" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="450;400;450" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom tagline -->
  <text x="600" y="210" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" opacity="0.7">
    Curated list for HR, talent management, and people analytics teams
  </text>

  <!-- Animated scan line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#textGrad)" opacity="0.15">
    <animate attributeName="y" values="0;300;0" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
